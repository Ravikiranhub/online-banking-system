server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: banksphere
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/banksphere?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:banksphere}
    password: ${DB_PASSWORD:banksphere123}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:change-this-demo-secret-please-use-at-least-64-characters-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_DATA:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
