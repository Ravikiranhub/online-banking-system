spring:
  datasource:
    url: jdbc:h2:mem:banksphere-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
app:
  jwt:
    secret: unit-test-secret-value-that-is-long-enough-for-hmac-signing-keys
    expiration-ms: 3600000
  seed:
    enabled: false
