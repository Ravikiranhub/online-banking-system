services:
  mysql:
    image: mysql:8.4
    container_name: banksphere-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-banksphere}
      MYSQL_USER: ${MYSQL_USER:-banksphere}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-banksphere123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "3306:3306"
    volumes:
      - banksphere-mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  banksphere-mysql-data:
